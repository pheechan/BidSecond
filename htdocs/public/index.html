<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidding Website</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header id="header">
        <div class="banner">
            <div class="logo">BidSecond</div>
                <a href='#'><img src="gavel.png" alt="Biddr"></xa>
                
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">Categories</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
            <div class="search-bar">
                <input type="text" placeholder="Search for items...">
                <button type="submit">Search</button>
            </div>
            <div class="cart-icon">
                <a href="#"><img src="images/gavel.png" alt="Cart"></a>
            </div>
        </div>
    </header>
    <main id="main-content">
        <div class="slideshow-container">
            <div class="mySlides fade">
                <img src="images/promo1.png" style="width:100%">
            </div>
            <div class="mySlides fade">
                <img src="images/promo2.png" style="width:100%">
            </div>
            <div class="mySlides fade">
                <img src="images/promo3.jpg" style="width:100%">
            </div>
        </div>
        <br>
        <div style="text-align:center">
            <span class="dot"></span> 
            <span class="dot"></span> 
            <span class="dot"></span> 
        </div>
        <h2>Spotlight on Hot Bids</h2>
        <div class="hot-bids">
            <div class="bid-item">Hot Bid 1</div>
            <div class="bid-item">Hot Bid 2</div>
            <div class="bid-item">Hot Bid 3</div>
        </div>
    </main>
    <footer id="footer"></footer>
    <script src="scripts/main.js"></script>
</body>
</html>
